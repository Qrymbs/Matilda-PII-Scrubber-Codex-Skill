name: Validate release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r skills/matilda-pii-scrubber/scripts/requirements-dev.txt
      - name: Verify release versions
        run: python -c 'from pathlib import Path; import yaml; v = Path("VERSION").read_text().strip(); s = Path("skills/matilda-pii-scrubber/SKILL.md").read_text().split("---", 2)[1]; assert yaml.safe_load(s)["metadata"]["version"] == v'
      - name: Test installer and repository hygiene
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Test skill
        run: python -m unittest discover -s skills/matilda-pii-scrubber/scripts -p '*test*.py' -v
      - name: Exercise supported formats through finalization
        run: python skills/matilda-pii-scrubber/scripts/preflight.py --formats csv xlsx xls parquet
